plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.unpam.mentari.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.unpam.mentari.assistant"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.10.2"
        // Tidak ada API key yang ditanam ke APK: key diisi manual di halaman Pengaturan aplikasi.
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // addDocumentStartJavaScript: menyuntikkan script sejak awal halaman, seperti content script extension
    implementation 'androidx.webkit:webkit:1.8.0'
}
